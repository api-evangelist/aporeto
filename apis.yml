name: Aporeto
description: Aporeto was a zero trust cloud security company providing machine identity-based
  microsegmentation, a distributed firewall, and Kubernetes network security for hybrid and
  multi-cloud application workloads. Backed by DCVC and Wing Venture Capital, Aporeto was acquired
  by Palo Alto Networks in December 2019 (~$150M) and its identity-based microsegmentation platform
  was folded into Prisma Cloud. The company no longer operates an independent product, brand, or
  developer surface; aporeto.com now redirects to Palo Alto Networks' Prisma Cloud. This profile is
  retained as a network record of the acquired company; no standalone API, developer portal, or
  specification surface exists to enrich.
